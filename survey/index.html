  // 前三名：與第三名同分者一併列入；分數過於平均時不硬排名次
  function rankScores(scores) {
    const sorted = [...CATEGORIES].sort((a, b) => scores[b.name] - scores[a.name]);
    const vals = sorted.map(c => scores[c.name]);
    const balanced = (vals[0] - vals[vals.length - 1]) <= 4;
    const cut = vals[2];
    const top = balanced ? [] : sorted.filter(c => scores[c.name] >= cut).map(c => c.name);
    return { sorted, top, balanced, tied: top.length > 3 };
  }

  async function handleFormSubmit(e) {
    e.preventDefault();
    if (!db || !setDoc) return showError('系統仍在連線中，請稍候幾秒再送出。');
    if (isSubmitting) return;
    hideError();

    const val = id => document.getElementById(id).value.trim();
    const name = val('user-name'), fellowship = val('user-fellowship'), group = val('user-group'),
      mentor = val('user-mentor'), sex = val('user-sex'), schoolTitle = val('user-school-title'),
      contact = val('user-contact'), source = val('user-source'), faith = val('user-faith');
    const hopes = Array.from(document.querySelectorAll('#user-hopes input:checked')).map(el => el.value);

    const fail = (msg, id) => { showError(msg); focusField(id); };
    if (!name) return fail("請輸入姓名", 'user-name');
    if (!sex) return fail("請選擇性別", 'user-sex');
    if (!fellowship) return fail("請選擇團契", 'user-fellowship');
    if (!contact) return fail("請輸入手機／電子信箱", 'user-contact');
    if (!mentor) return fail("請輸入輔導／誰邀請您來到聚會", 'user-mentor');
    if (!source) return fail("請選擇從哪裡得知活動資訊", 'user-source');
    if (!faith) return fail("請選擇信仰", 'user-faith');
    if (hopes.length === 0) return fail("請至少選擇一項希望透過本活動達成的目標", 'user-hopes');

    const answers = {};
    for (let i = 0; i < QUESTIONS.length; i++) {
      const checked = document.querySelector(`input[name="q-${i}"]:checked`);
      if (!checked) {
        document.getElementById(`q-${i}`).classList.add('missing');
        showError(`尚未完成第 ${i + 1} 題`);
        document.getElementById(`q-${i}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      answers[i] = parseInt(checked.value);
    }

    const scores = {};
    CATEGORIES.forEach(cat => { scores[cat.name] = cat.indices.reduce((sum, idx) => sum + answers[idx], 0); });

    const submission = {
      name, fellowship, group,
      '輔導/誰邀請您來到聚會': mentor,
      sex, schoolTitle, contact, source, faith, hopes,
      preferences: [], scores,
      timestamp: new Date().toLocaleString(), createdAt: Date.now()
    };

    isSubmitting = true;
    const btn = document.getElementById('submit-btn');
    if (btn) { btn.disabled = true; btn.textContent = '儲存中...'; }
    let ok = false;
    try {
      // 先固定文件 ID：逾時後再送，會覆寫同一筆，不會多出重複紀錄
      if (!pendingRef) pendingRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'submissions'));
      await withTimeout(setDoc(pendingRef, submission), 15000);
      window.lastResult = { ...submission, id: pendingRef.id };
      store.set(RESULT_KEY, window.lastResult);
      store.del(DRAFT_KEY);
      pendingRef = null;
      currentView = 'result';
      ok = true;
    } catch (err) {
      showError("儲存失敗：" + err.message);
    } finally {
      isSubmitting = false;
      if (ok) { render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      else if (btn) { btn.disabled = false; btn.textContent = '送出並查看結果'; }
    }
  }

  async function savePreferences() {
    if (!db || !updateDoc) return showError('系統仍在連線中，請稍候幾秒再送出。');
    if (isSubmitting) return;
    hideError();
    const p1 = document.getElementById('result-pref-1').value;
    const p2 = document.getElementById('result-pref-2').value;
    const p3 = document.getElementById('result-pref-3').value;
    if (!p1 || !p2 || !p3) return showError('請完整選擇第一、二、三志願');
    if (p1 === p2 || p1 === p3 || p2 === p3) return showError('前三志願不能選擇重複的組別，請重新確認！');
    if (!window.lastResult || !window.lastResult.id) return showError('找不到本次評量紀錄，請重新進行測驗。');

    const preferences = [p1, p2, p3];
    isSubmitting = true;
    const btn = document.getElementById('save-preferences-btn');
    if (btn) { btn.disabled = true; btn.textContent = '儲存中...'; }
    try {
      await withTimeout(updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', window.lastResult.id), { preferences }), 15000);
      window.lastResult.preferences = preferences;
      store.set(RESULT_KEY, window.lastResult);
      const m = document.getElementById('pref-saved');
      m.textContent = '✓ 已送出：' + preferences.map((p, i) => `${i + 1}. ${p}`).join('　');
      m.classList.remove('hidden');
      if (btn) btn.textContent = '更新志願';
    } catch (err) {
      showError('志願儲存失敗：' + err.message);
      if (btn) btn.textContent = '送出前三志願';
    } finally {
      isSubmitting = false;
      if (btn) btn.disabled = false;
    }
  }

  function renderRadarChart(scores) {
    const size = 440, center = 220, radius = 118, labelRadius = 164;
    const step = 360 / CATEGORIES.length;
    // 分數最低為 6，圓心代表 6 分，圖形才不會縮在中間
    const at = (val, offset, rOverride) => {
      const r = rOverride !== undefined ? rOverride : ((val - MIN_SCORE) / (MAX_SCORE - MIN_SCORE)) * radius;
      const a = (offset * Math.PI) / 180;
      return { x: center + r * Math.sin(a), y: center - r * Math.cos(a) };
    };
    const points = CATEGORIES.map((c, i) => { const p = at(Number(scores[c.name]) || MIN_SCORE, i * step); return `${p.x},${p.y}`; }).join(' ');
    const axes = CATEGORIES.map((_, i) => { const o = at(MAX_SCORE, i * step); return `<line x1="${center}" y1="${center}" x2="${o.x}" y2="${o.y}" stroke="#d1d5db" stroke-dasharray="3 3"/>`; }).join('');
    const grids = [12, 18, 24, 30, 36].map(v => {
      const p = CATEGORIES.map((_, i) => { const c = at(v, i * step); return `${c.x},${c.y}`; }).join(' ');
      return `<polygon points="${p}" fill="none" stroke="#e5e7eb" stroke-width="1"/>`;
    }).join('');
    const labels = CATEGORIES.map((c, i) => {
      const p = at(MAX_SCORE, i * step, labelRadius);
      const lines = ['邏輯數學', '自然觀察', '肢體動覺'].includes(c.name) ? [c.name.slice(0, 2), c.name.slice(2)] : [c.name];
      const y0 = p.y - ((lines.length - 1) * 7);
      return `<text x="${p.x}" y="${y0}" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="800" fill="#14307a">${lines.map((l, j) => `<tspan x="${p.x}" dy="${j === 0 ? 0 : 15}">${l}</tspan>`).join('')}</text>`;
    }).join('');
    const dots = CATEGORIES.map((c, i) => { const p = at(Number(scores[c.name]) || MIN_SCORE, i * step); return `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#e8541e" stroke="#fff" stroke-width="2"/>`; }).join('');

    const chart = document.getElementById('chart-container');
    if (!chart) return;
    chart.innerHTML = `
      <svg role="img" aria-label="八大智能分數雷達圖" viewBox="0 0 ${size} ${size}" width="100%" style="display:block;overflow:visible">
        ${grids}${axes}
        <polygon points="${points}" fill="rgba(232,84,30,.28)" stroke="#e8541e" stroke-width="3" stroke-linejoin="round"/>
        ${dots}${labels}
      </svg>
      <p style="font-size:.75rem;color:#8a90a0;margin:6px 0 0">雷達圖由圓心（6 分）到外圈（36 分），越往外代表分數越高。</p>`;
  }

  init();
</script>
</head>
<body>

    </div>

    <header class="hero" id="hero">

      <svg class="star" style="top:100px;right:0;width:28px" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 0 L58 38 L100 50 L58 62 L50 100 L42 62 L0 50 L42 38Z" fill="#1f8a9e"/></svg>
      <svg class="star" style="top:14px;left:46%;width:24px" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 0 L58 38 L100 50 L58 62 L50 100 L42 62 L0 50 L42 38Z" fill="#1f8a9e"/></svg>

      <div class="org"><i style="background:var(--navy)"></i><span>基督教台灣貴格會合一堂<small>Taiwan Harmony Friends Church</small></span></div>
