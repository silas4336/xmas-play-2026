<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找到我的超能力｜八大智能評量</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #14307a; --orange: #e8541e; --yellow: #f7c935;
    --ink: #1a1a2e; --muted: #5b6275; --line: #d5d9e4; --paper: #fbfbf8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--ink); line-height: 1.65;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    background-color: var(--paper);
    background-image: linear-gradient(#e9ecf2 1px, transparent 1px), linear-gradient(90deg, #e9ecf2 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
  .hidden { display: none !important; }
  .center { text-align: center; }

  /* ---------- 頂端：主辦單位 logo ---------- */
  .topbar { background: #fff; border-bottom: 1px solid var(--line); }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
  .logos { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; }
  .logos img { height: 34px; width: auto; display: block; }
  .topbar .aside { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .topbar b { color: var(--navy); font-weight: 900; }
  .ghost { font: inherit; font-size: .85rem; font-weight: 700; color: var(--ink); background: #fff; cursor: pointer;
    border: 1px solid var(--ink); border-radius: 4px; padding: 5px 14px; text-decoration: none; }
  .ghost:hover { background: var(--ink); color: #fff; }

  /* ---------- 標題區 ---------- */
  .hero { padding: 40px 0 10px; }
  .hero h1 { margin: 0; font-weight: 900; line-height: 1.1; letter-spacing: .02em; color: var(--navy); font-size: clamp(2.4rem, 10vw, 4.8rem); }
  .hero h1 em { font-style: normal; color: var(--orange); }
  .hero .sub { margin: 14px 0 0; font-weight: 900; letter-spacing: .08em; font-size: clamp(1.1rem, 4vw, 1.6rem); }
  /* 仿海報的「標題｜內容」資訊列 */
  .info { margin-top: 26px; }
  .info .row { display: flex; align-items: flex-start; padding: 7px 0; }
  .info dt { flex: 0 0 4.2em; font-weight: 900; font-size: 1.15rem; color: var(--ink); letter-spacing: .1em; }
  .info dd { margin: 0; padding-left: 16px; border-left: 2px solid var(--ink); font-size: 1.02rem; }
  .info { padding: 0; }

  main { padding: 22px 0 56px; }

  /* ---------- 區塊 ---------- */
  .card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 22px; margin-bottom: 18px; }
  .card.note { background: transparent; border: 0; border-left: 3px solid var(--navy); border-radius: 0; padding: 4px 0 4px 16px; }
  .card.warn { background: #fff8d6; border-color: #ecd77a; }
  .card h2 { margin: 0 0 16px; font-size: 1.2rem; font-weight: 900; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .card h3 { margin: 0 0 6px; font-size: 1rem; font-weight: 900; }
  .card p { margin: 0 0 6px; font-size: .92rem; color: #333a4d; }
  .grid2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } .span2 { grid-column: 1 / -1; } }
  .field label.lab { display: block; font-size: .82rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .req { color: var(--orange); }
  input[type=text], input[type=password], select {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: #fff;
    border: 1px solid #aeb5c6; border-radius: 4px; padding: 9px 11px; outline: none; }
  input[type=text]:focus, input[type=password]:focus, select:focus { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy); }
  .checks { display: grid; grid-template-columns: 1fr; gap: 6px 18px; }
  @media (min-width: 640px) { .checks { grid-template-columns: 1fr 1fr; } }
  .checks label { display: flex; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; font-size: .95rem; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--orange); }

  /* ---------- 題目 ---------- */
  .progress { position: sticky; top: 0; z-index: 5; margin: -22px -22px 14px; padding: 10px 22px 8px; background: #fff; border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0; }
  .progress .bar { height: 5px; background: #e6e9f0; }
  .progress .bar i { display: block; height: 100%; width: 0; background: var(--orange); transition: width .25s; }
  .progress small { display: block; margin-top: 4px; font-weight: 700; color: var(--muted); font-size: .78rem; }
  .q { padding: 16px 0 14px; border-bottom: 1px solid #e6e9f0; }
  .q:last-child { border-bottom: 0; }
  .q p { margin: 0 0 10px; font-size: 1rem; color: var(--ink); }
  .q.missing { background: #fff3f3; box-shadow: -10px 0 0 #fff3f3, 10px 0 0 #fff3f3; }
  .q.missing p { color: #b42424; }
  .scale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .scale label { position: relative; cursor: pointer; }
  .scale input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .scale span { display: block; text-align: center; padding: 9px 0; border: 1px solid #aeb5c6; border-radius: 4px; font-weight: 700; color: var(--muted); background: #fff; }
  .scale label:hover span { border-color: var(--navy); color: var(--navy); }
  .scale input:checked + span { background: var(--orange); border-color: var(--orange); color: #fff; }
  .scale input:focus-visible + span { outline: 2px solid var(--navy); outline-offset: 2px; }
  .ends { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-top: 4px; }

  /* ---------- 按鈕 ---------- */
  .btn { font: inherit; font-weight: 900; letter-spacing: .1em; cursor: pointer; color: #fff; background: var(--orange);
    border: 0; border-radius: 4px; padding: 13px 40px; font-size: 1.02rem; }
  .btn:hover { background: #cf4616; }
  .btn:disabled { background: #9aa0ad; cursor: default; }
  .btn.sm { padding: 8px 20px; font-size: .9rem; }
  .btn.alt { background: #fff; color: var(--ink); border: 1px solid var(--ink); }
  .btn.alt:hover { background: var(--ink); color: #fff; }
  .btn.green { background: #1f8a4c; }
  .btn.green:hover { background: #197340; }
  .btn.red { background: #c93434; }

  .error { background: #fff0f0; border-left: 4px solid #c93434; color: #a42626; padding: 12px 16px; font-weight: 700; font-size: .92rem; margin-bottom: 18px; }

  /* ---------- 結果 ---------- */
  .result-name { margin: 0 0 4px; font-size: 1.7rem; font-weight: 900; }
  .top3 { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); padding: 16px 0; margin: 18px 0 20px; text-align: left; }
  .top3 small { display: block; color: var(--muted); font-size: .82rem; font-weight: 700; margin-bottom: 4px; }
  .top3 strong { font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 900; line-height: 1.4; color: var(--navy); }
  .scores { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); text-align: left; }
  @media (min-width: 640px) { .scores { grid-template-columns: repeat(4, 1fr); } }
  .score { padding: 10px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fff; }
  .score .n { font-size: .85rem; font-weight: 700; color: var(--muted); }
  .score .v { font-size: 1.6rem; font-weight: 900; line-height: 1.25; }
  .score .v small { font-size: .78rem; font-weight: 400; color: var(--muted); }
  .score.top { background: #fff4ee; box-shadow: inset 0 3px 0 var(--orange); }
  .score.top .n, .score.top .v { color: var(--orange); }
  .bal { border-left: 3px solid var(--navy); padding: 4px 0 4px 14px; margin: 18px 0 20px; text-align: left; font-weight: 700; color: var(--ink); }
  .prefs { display: grid; grid-template-columns: 1fr; gap: 12px; text-align: left; }
  @media (min-width: 640px) { .prefs { grid-template-columns: repeat(3, 1fr); } }
  .prefs label { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .bandchk { display: flex; gap: 10px; align-items: center; margin: 10px 0 14px; font-size: .92rem; }
  .saved { color: #1f8a4c; font-weight: 900; margin-top: 12px; }
  .credit { font-size: .76rem; color: #8a90a0; max-width: 36rem; margin: 16px auto 0; }

  /* ---------- 後台 ---------- */
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; min-width: 1500px; font-size: .78rem; text-align: left; background: #fff; }
  th { background: #eef1f8; color: var(--navy); white-space: nowrap; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); vertical-align: top; }
  td small { display: block; color: #9aa0ad; font-size: .68rem; }
  td.num { text-align: center; font-family: ui-monospace, monospace; }
  .row-actions { display: flex; align-items: center; gap: 10px; }
  .empty { padding: 40px 0; text-align: center; color: #9aa0ad; }
  details.more { text-align: left; margin-top: 14px; }
  details.more summary { cursor: pointer; font-weight: 900; color: var(--navy); padding: 6px 0; }

  .modal { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal .box { background: #fff; border-radius: 6px; padding: 24px; max-width: 360px; width: 100%; text-align: center; }
  .modal .box h3 { margin: 0 0 10px; font-weight: 900; font-size: 1.15rem; }
  .modal .row { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }

  footer { border-top: 1px solid var(--line); background: #fff; padding: 16px 0 26px; font-size: .78rem; color: var(--muted); text-align: center; }

  .spin { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #dfe3ef; border-top-color: var(--orange); animation: sp 1s linear infinite; margin: 0 auto 12px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade { animation: fadeIn .35s ease-out both; }
  @media (prefers-reduced-motion: reduce) { .fade, .spin { animation: none; } }
  @media (max-width: 520px) { .logos img { height: 24px; } .logos { gap: 6px 12px; } }
</style>

    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },

  async function init() {
    // 之前填過的人，重新打開直接回到自己的結果
    const saved = store.get(RESULT_KEY);
    if (saved && saved.scores && saved.id) { window.lastResult = saved; currentView = 'result'; }

      ]);

      showError("系統連線失敗，請確認網路後重新整理頁面。詳細訊息：" + (err.message || err));

  function hideError() { errorBanner.classList.add('hidden'); }

  // --- 48 題 ---
  const QUESTIONS = [
    "我能適時地在說話或寫作時融入多元不同的管道得來的資訊。",

    "我關注並認知自然界能量系統的變化及轉換，如：電能、風能、熱能、機械能、太陽能等。",
    "我能分辨不同型態的山岳及雲朵。",
    "我擅長配合音樂節奏準確打拍子。",
    "我能分辨不同樂器音色，並聽出曲調高低、節奏快慢及旋律是否正確。",

    "我能覺察並有效管理自己的情緒。",

  const CATEGORIES = [
    { name: '語文', indices: [0, 1, 2, 3, 4, 5] },
    { name: '邏輯數學', indices: [6, 7, 8, 9, 10, 11] },
    { name: '自然觀察', indices: [12, 13, 14, 15, 16, 17] },
    { name: '音樂', indices: [18, 19, 20, 21, 22, 23] },
    { name: '肢體動覺', indices: [24, 25, 26, 27, 28, 29] },
    { name: '空間', indices: [30, 31, 32, 33, 34, 35] },
    { name: '內省', indices: [36, 37, 38, 39, 40, 41] },
    { name: '人際', indices: [42, 43, 44, 45, 46, 47] }
  ];

  const MIN_SCORE = 6, MAX_SCORE = 36;

  // 前三名：與第三名同分者一併列入；分數過於平均時不硬排名次
  function rankScores(scores) {
    const sorted = [...CATEGORIES].sort((a, b) => scores[b.name] - scores[a.name]);
    const vals = sorted.map(c => scores[c.name]);
    const balanced = (vals[0] - vals[vals.length - 1]) <= 4;
    const cut = vals[2];
    const top = balanced ? [] : sorted.filter(c => scores[c.name] >= cut).map(c => c.name);
    return { sorted, top, balanced, tied: top.length > 3 };
  }

  function render() {
    if (currentView === 'form') renderForm();
    else if (currentView === 'result') renderResult();
    document.getElementById('hero').classList.toggle('hidden', currentView !== 'form');

  // --- 草稿：不小心關掉也不會白填 ---
  function saveDraft() {
    const form = document.getElementById('survey-form');
    if (!form) return;
    const d = { f: {}, h: [], a: {} };
    ['user-name', 'user-sex', 'user-fellowship', 'user-group', 'user-school-title', 'user-contact', 'user-mentor', 'user-source', 'user-faith']
      .forEach(id => { d.f[id] = document.getElementById(id).value; });
    d.h = Array.from(document.querySelectorAll('#user-hopes input:checked')).map(el => el.value);
    QUESTIONS.forEach((_, i) => { const c = document.querySelector(`input[name="q-${i}"]:checked`); if (c) d.a[i] = c.value; });
    store.set(DRAFT_KEY, d);
    const h = document.getElementById('saved-hint');
    if (h) h.classList.remove('hidden');
  }
  function restoreDraft() {
    const d = store.get(DRAFT_KEY);
    if (!d) return;
    Object.entries(d.f || {}).forEach(([id, v]) => { const el = document.getElementById(id); if (el) el.value = v; });
    document.querySelectorAll('#user-hopes input').forEach(el => { el.checked = (d.h || []).includes(el.value); });
    Object.entries(d.a || {}).forEach(([i, v]) => {
      const el = document.querySelector(`input[name="q-${i}"][value="${v}"]`);
      if (el) { el.checked = true; document.getElementById(`q-${i}`).classList.add('done'); }
    });
    updateProgress();
  }
  function renderForm() {
    const questionsHtml = QUESTIONS.map((q, i) => `
      <div class="q" id="q-${i}">
        <p>${i + 1}. ${q}</p>
        <div class="scale">
          ${[1, 2, 3, 4, 5, 6].map(s => `<label><input type="radio" name="q-${i}" value="${s}"><span>${s}</span></label>`).join('')}
        </div>
        <div class="ends"><span>完全不同意</span><span>非常同意</span></div>
      </div>`).join('');

    mainContent.innerHTML = `
      <form id="survey-form" class="fade" novalidate>
        <div class="card note">
          <h3>個人資料蒐集處理利用告知</h3>
          <p>本問卷所收集之個資與測驗結果，僅限於本次活動使用，繼續填寫即代表您同意上述條款。</p>
          <p>本測驗共 48 題，填寫約需 5–10 分鐘，測驗結果僅供活動參考。</p>
        </div>

        <div class="card">
          <h2>基本資料</h2>
          <div class="grid2">
            <div class="field"><label class="lab" for="user-name">姓名 <span class="req">*</span></label>
              <input id="user-name" type="text" autocomplete="name" placeholder="請輸入姓名"></div>
            <div class="field"><label class="lab" for="user-sex">性別 <span class="req">*</span></label>
              <select id="user-sex"><option value="">請選擇</option><option>男</option><option>女</option></select></div>
            <div class="field"><label class="lab" for="user-fellowship">團契 <span class="req">*</span></label>
              <select id="user-fellowship">
                <option value="">請選擇</option>
                <option>合一團契（學生）</option>
                <option>晨星團契（工作青年）</option>
                <option>家恩團契（已婚族群）</option>
                <option>其他</option>
              </select></div>
            <div class="field"><label class="lab" for="user-group">小組（如果已經有加入團契小組請填寫）</label>
              <input id="user-group" type="text" placeholder="請輸入小組（非必填）"></div>
            <div class="field"><label class="lab" for="user-school-title">學校系級／職稱（主要工作內容）</label>
              <input id="user-school-title" type="text" placeholder="請輸入學校系級或主要工作內容"></div>
            <div class="field"><label class="lab" for="user-contact">手機／電子信箱 <span class="req">*</span></label>
              <input id="user-contact" type="text" inputmode="email" autocomplete="email" placeholder="請輸入手機或電子信箱"></div>
            <div class="field span2"><label class="lab" for="user-mentor">輔導／誰邀請您來到聚會 <span class="req">*</span></label>
              <input id="user-mentor" type="text" placeholder="請輸入輔導或邀請您的人"></div>
            <div class="field"><label class="lab" for="user-source">從哪裡得知活動資訊 <span class="req">*</span></label>
              <select id="user-source"><option value="">請選擇</option><option>拿到 DM 傳單</option><option>親友邀請</option><option>各校新心社</option><option>新生 Line 群組</option><option>Facebook</option><option>Instagram</option><option>Threads</option><option>合一堂好康活動 Line 群組</option><option>其他</option></select></div>
            <div class="field"><label class="lab" for="user-faith">信仰 <span class="req">*</span></label>
              <select id="user-faith"><option value="">請選擇</option><option>無特定信仰</option><option>佛／道教</option><option>對基督信仰感興趣</option><option>基督徒，正在尋找教會</option><option>基督徒，有穩定聚會的教會</option><option>其他</option></select></div>
          </div>
          <div class="field" style="margin-top:18px">
            <label class="lab">希望透過本活動（可複選）<span class="req">*</span></label>
            <div class="checks" id="user-hopes">
              <label><input type="checkbox" value="了解八大智能">了解八大智能</label>
              <label><input type="checkbox" value="增進較弱智能的能力">增進較弱智能的能力</label>
              <label><input type="checkbox" value="增強較強智能的發揮">增強較強智能的發揮</label>
              <label><input type="checkbox" value="了解個人智能，探索未來發展">了解個人智能，探索未來發展</label>
              <label><input type="checkbox" value="其他">其他</label>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="progress" id="progress">
            <div class="bar"><i id="progress-fill"></i></div>
            <small><span id="progress-text">已完成 0 / 48 題</span><span id="saved-hint" class="hidden"> ・草稿已自動儲存</span></small>
          </div>
          <h2>評量題目</h2>
          <p style="margin-bottom:16px">每題請選擇 1（完全不同意）到 6（非常同意）</p>
          ${questionsHtml}
        </div>

        <div class="center" style="padding:4px 0 20px">
          <button type="submit" id="submit-btn" class="btn">${isSubmitting ? '儲存中...' : '送出並查看結果'}</button>
        </div>
      </form>`;

    const form = document.getElementById('survey-form');
    form.onsubmit = handleFormSubmit;
    form.addEventListener('change', e => {
      if (e.target.name && e.target.name.startsWith('q-')) {
        const box = document.getElementById(e.target.name);
        box.classList.add('done'); box.classList.remove('missing');
        updateProgress();
      }
      saveDraft();
    });
    form.addEventListener('input', saveDraft);
    restoreDraft();
  }

  function updateProgress() {
    const n = QUESTIONS.filter((_, i) => document.querySelector(`input[name="q-${i}"]:checked`)).length;
    document.getElementById('progress-fill').style.width = (n / QUESTIONS.length * 100) + '%';
    document.getElementById('progress-text').textContent = `已完成 ${n} / ${QUESTIONS.length} 題`;
  }

  function focusField(id) {
    const el = document.getElementById(id);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => el.focus && el.focus({ preventScroll: true }), 300); }
  }


  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('連線逾時，請確認網路後再按一次送出（不會重複送出）')), ms))]);

  async function handleFormSubmit(e) {
    e.preventDefault();
    if (!db || !setDoc) return showError('系統仍在連線中，請稍候幾秒再送出。');
    if (isSubmitting) return;
    hideError();

    const val = id => document.getElementById(id).value.trim();
    const name = val('user-name'), fellowship = val('user-fellowship'), group = val('user-group'),
      mentor = val('user-mentor'), sex = val('user-sex'), schoolTitle = val('user-school-title'),
      contact = val('user-contact'), source = val('user-source'), faith = val('user-faith');
    const hopes = Array.from(document.querySelectorAll('#user-hopes input:checked')).map(el => el.value);

    const fail = (msg, id) => { showError(msg); focusField(id); };
    if (!name) return fail("請輸入姓名", 'user-name');
    if (!sex) return fail("請選擇性別", 'user-sex');
    if (!fellowship) return fail("請選擇團契", 'user-fellowship');
    if (!contact) return fail("請輸入手機／電子信箱", 'user-contact');
    if (!mentor) return fail("請輸入輔導／誰邀請您來到聚會", 'user-mentor');
    if (!source) return fail("請選擇從哪裡得知活動資訊", 'user-source');
    if (!faith) return fail("請選擇信仰", 'user-faith');
    if (hopes.length === 0) return fail("請至少選擇一項希望透過本活動達成的目標", 'user-hopes');

    const answers = {};
    for (let i = 0; i < QUESTIONS.length; i++) {
      const checked = document.querySelector(`input[name="q-${i}"]:checked`);
      if (!checked) {
        document.getElementById(`q-${i}`).classList.add('missing');
        showError(`尚未完成第 ${i + 1} 題`);
        document.getElementById(`q-${i}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      answers[i] = parseInt(checked.value);
    }

    const scores = {};
    CATEGORIES.forEach(cat => { scores[cat.name] = cat.indices.reduce((sum, idx) => sum + answers[idx], 0); });

    const submission = {
      name, fellowship, group,
      '輔導/誰邀請您來到聚會': mentor,
      sex, schoolTitle, contact, source, faith, hopes,
      preferences: [], scores,
      timestamp: new Date().toLocaleString(), createdAt: Date.now()
    };

    isSubmitting = true;
    const btn = document.getElementById('submit-btn');
    if (btn) { btn.disabled = true; btn.textContent = '儲存中...'; }
    let ok = false;
    try {
      // 先固定文件 ID：逾時後再送，會覆寫同一筆，不會多出重複紀錄
      if (!pendingRef) pendingRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'submissions'));
      await withTimeout(setDoc(pendingRef, submission), 15000);
      window.lastResult = { ...submission, id: pendingRef.id };
      store.set(RESULT_KEY, window.lastResult);
      store.del(DRAFT_KEY);
      pendingRef = null;
      currentView = 'result';
      ok = true;
    } catch (err) {
      showError("儲存失敗：" + err.message);
    } finally {
      isSubmitting = false;
      if (ok) { render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      else if (btn) { btn.disabled = false; btn.textContent = '送出並查看結果'; }
    }
  }

  function renderResult() {
    if (!window.lastResult) { currentView = 'form'; render(); return; }
    const result = window.lastResult;
    const scores = result.scores;
    const { sorted, top, balanced, tied } = rankScores(scores);
    const saved = (result.preferences || []).length === 3;
    mainContent.innerHTML = `
      <div class="card fade center">
        <h2 class="result-name" style="border:0;padding:0">${esc(result.name)} 的分析結果</h2>
        <div id="chart-container" style="max-width:440px;margin:14px auto 6px"></div>

        ${balanced ? `
          <div class="bal">各項分數很接近，沒有特別突出的項目。</div>` : `
          <div class="top3">
            <small>${tied ? '前三名（含同分並列）' : '前三大優勢智能'}</small>
            <strong>${top.join('、')}</strong>
          </div>`}

        <div class="scores">
          ${CATEGORIES.map(c => `
            <div class="score ${top.includes(c.name) ? 'top' : ''}">
              <div class="n">${c.name}</div>
              <div class="v">${scores[c.name]}<small> / 36</small></div>
            </div>`).join('')}
        </div>
        <p class="credit" style="margin-top:10px">每項 6 題，分數範圍 6–36。</p>

        <div class="card" style="margin:28px 0 0;text-align:left;background:#fafbfd">
          <h3>${saved ? '您選填的前三志願（可修改）' : '請選填希望參加的前三志願組別'}</h3>
          <p>${saved ? '想換志願的話，重新選擇後按「更新志願」即可。' : (top.length ? '已依你的結果預先帶入，可自行調整；' : '') + '順序即為志願順序，三個志願不可重複。'}</p>
          <label class="bandchk"><input type="checkbox" id="band-chk"> 我已加入合一堂樂團／管弦樂團（會隱藏音樂智能組別，因您的音樂智能已在開發中囉！）</label>
          <div class="prefs">
            ${[1, 2, 3].map(i => `
              <div><label for="result-pref-${i}">第${i}志願</label>
                <select id="result-pref-${i}"></select></div>`).join('')}
          </div>
          <div class="center" style="margin-top:18px"><button type="button" id="save-preferences-btn" class="btn sm">${saved ? '更新志願' : '送出前三志願'}</button></div>
          <div id="pref-saved" class="saved center ${saved ? '' : 'hidden'}">✓ 已送出：${(result.preferences || []).map((p, i) => `${i + 1}. ${esc(p)}`).join('　')}</div>
        </div>

        <div style="margin-top:28px">
          <button id="reset-btn" class="btn sm alt">重新填寫</button>
          <p class="credit">這份結果會保存在這支手機／瀏覽器，下次打開會直接看到。換裝置或清除瀏覽資料後就看不到了，建議先截圖保存。</p>
          <p class="credit">本測驗以國立臺灣大學《適性揚才行動方案》計畫團隊擬定之多元智能線上施測內容為本，搜尋該計劃網頁可觀看更完整內容。</p>
        </div>
      </div>`;

    // 志願選單：預設帶入既有志願，否則帶入前三名
    // 均衡型沒有明顯強項，志願留白讓使用者自己選
    const defaults = saved ? result.preferences : top.slice(0, 3);
    const buildOptions = () => {
      const noMusic = document.getElementById('band-chk').checked;
      const names = CATEGORIES.map(c => c.name).filter(n => !(noMusic && n === '音樂'));
      [1, 2, 3].forEach(i => {
        const sel = document.getElementById(`result-pref-${i}`);
        const cur = sel.value || defaults[i - 1];
        sel.innerHTML = '<option value="">請選擇</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
        sel.value = names.includes(cur) ? cur : '';
      });
    };
    buildOptions();
    document.getElementById('band-chk').onchange = buildOptions;
    renderRadarChart(scores);
    document.getElementById('save-preferences-btn').onclick = savePreferences;
    // 嵌入頁面中 confirm() 可能被封鎖，改成「再按一次確認」
    const resetBtn = document.getElementById('reset-btn');
    let armed = false;
    resetBtn.onclick = () => {
      if (!armed) {
        armed = true; resetBtn.textContent = '再按一次確認（會清除這支裝置上的結果）';
        setTimeout(() => { armed = false; resetBtn.textContent = '重新填寫'; }, 5000);
        return;
      }
      window.lastResult = null; store.del(RESULT_KEY); store.del(DRAFT_KEY); pendingRef = null; currentView = 'form'; render();
    };
  }

  async function savePreferences() {
    if (!db || !updateDoc) return showError('系統仍在連線中，請稍候幾秒再送出。');
    if (isSubmitting) return;
    hideError();
    const p1 = document.getElementById('result-pref-1').value;
    const p2 = document.getElementById('result-pref-2').value;
    const p3 = document.getElementById('result-pref-3').value;
    if (!p1 || !p2 || !p3) return showError('請完整選擇第一、二、三志願');
    if (p1 === p2 || p1 === p3 || p2 === p3) return showError('前三志願不能選擇重複的組別，請重新確認！');
    if (!window.lastResult || !window.lastResult.id) return showError('找不到本次評量紀錄，請重新進行測驗。');

    const preferences = [p1, p2, p3];
    isSubmitting = true;
    const btn = document.getElementById('save-preferences-btn');
    if (btn) { btn.disabled = true; btn.textContent = '儲存中...'; }
    try {
      await withTimeout(updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', window.lastResult.id), { preferences }), 15000);
      window.lastResult.preferences = preferences;
      store.set(RESULT_KEY, window.lastResult);
      const m = document.getElementById('pref-saved');
      m.textContent = '✓ 已送出：' + preferences.map((p, i) => `${i + 1}. ${p}`).join('　');
      m.classList.remove('hidden');
      if (btn) btn.textContent = '更新志願';
    } catch (err) {
      showError('志願儲存失敗：' + err.message);
      if (btn) btn.textContent = '送出前三志願';
    } finally {
      isSubmitting = false;
      if (btn) btn.disabled = false;
    }
  }

  function renderRadarChart(scores) {
    const size = 440, center = 220, radius = 118, labelRadius = 164;
    const step = 360 / CATEGORIES.length;
    // 分數最低為 6，圓心代表 6 分，圖形才不會縮在中間
    const at = (val, offset, rOverride) => {
      const r = rOverride !== undefined ? rOverride : ((val - MIN_SCORE) / (MAX_SCORE - MIN_SCORE)) * radius;
      const a = (offset * Math.PI) / 180;
      return { x: center + r * Math.sin(a), y: center - r * Math.cos(a) };
    };
    const points = CATEGORIES.map((c, i) => { const p = at(Number(scores[c.name]) || MIN_SCORE, i * step); return `${p.x},${p.y}`; }).join(' ');
    const axes = CATEGORIES.map((_, i) => { const o = at(MAX_SCORE, i * step); return `<line x1="${center}" y1="${center}" x2="${o.x}" y2="${o.y}" stroke="#d1d5db" stroke-dasharray="3 3"/>`; }).join('');
    const grids = [12, 18, 24, 30, 36].map(v => {
      const p = CATEGORIES.map((_, i) => { const c = at(v, i * step); return `${c.x},${c.y}`; }).join(' ');
      return `<polygon points="${p}" fill="none" stroke="#e5e7eb" stroke-width="1"/>`;
    }).join('');
    const labels = CATEGORIES.map((c, i) => {
      const p = at(MAX_SCORE, i * step, labelRadius);
      const lines = ['邏輯數學', '自然觀察', '肢體動覺'].includes(c.name) ? [c.name.slice(0, 2), c.name.slice(2)] : [c.name];
      const y0 = p.y - ((lines.length - 1) * 7);
      return `<text x="${p.x}" y="${y0}" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="800" fill="#14307a">${lines.map((l, j) => `<tspan x="${p.x}" dy="${j === 0 ? 0 : 15}">${l}</tspan>`).join('')}</text>`;
    }).join('');
    const dots = CATEGORIES.map((c, i) => { const p = at(Number(scores[c.name]) || MIN_SCORE, i * step); return `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#e8541e" stroke="#fff" stroke-width="2"/>`; }).join('');

    const chart = document.getElementById('chart-container');
    if (!chart) return;
    chart.innerHTML = `
      <svg role="img" aria-label="八大智能分數雷達圖" viewBox="0 0 ${size} ${size}" width="100%" style="display:block;overflow:visible">
        ${grids}${axes}
        <polygon points="${points}" fill="rgba(232,84,30,.28)" stroke="#e8541e" stroke-width="3" stroke-linejoin="round"/>
        ${dots}${labels}
      </svg>
      <p style="font-size:.75rem;color:#8a90a0;margin:6px 0 0">雷達圖由圓心（6 分）到外圈（36 分），越往外代表分數越高。</p>`;
  }

  init();
</script>
