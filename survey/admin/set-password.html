<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex"><title>產生後台密碼雜湊</title>
<style>
  body{font-family:"Noto Sans TC",system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.7;color:#1a1a2e}
  input,textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid #d9dde8;border-radius:12px;box-sizing:border-box}
  textarea{height:110px;font-family:ui-monospace,monospace;font-size:.8rem}
  button{font:inherit;font-weight:900;background:#e8541e;color:#fff;border:2px solid #1a1a2e;border-radius:999px;padding:10px 28px;cursor:pointer;margin:12px 0}
  code{background:#eef3ff;padding:2px 6px;border-radius:6px}
</style></head><body>
<h1>產生後台密碼雜湊</h1>
<p>在這裡輸入你想用的新密碼，會在<b>你自己的瀏覽器裡</b>算出一串雜湊值（密碼不會傳到任何地方）。
把產生的整串文字貼到 <code>admin/index.html</code> 裡的 <code>PASSWORD_HASH</code>，之後用這組密碼登入後台。</p>
<p>密碼請至少 12 個字元，混合文字與數字。</p>
<input id="pw" type="password" placeholder="輸入新密碼（至少 12 字元）" autocomplete="new-password">
<button id="go">產生</button>
<textarea id="out" readonly placeholder="產生的雜湊會顯示在這裡"></textarea>
<script>
  const ITER = 200000;
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  document.getElementById('go').onclick = async () => {
    const pw = document.getElementById('pw').value;
    if (pw.length < 12) { document.getElementById('out').value = '密碼太短，請至少 12 個字元。'; return; }
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITER }, key, 256);
    document.getElementById('out').value = ['pbkdf2', ITER, b64(salt), b64(bits)].join('$');
  };
</script></body></html>
