  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  async function checkPassword(pw) {
    const parts = PASSWORD_HASH.split('$');
    if (parts.length !== 4 || parts[0] !== 'pbkdf2') return false;
    const salt = Uint8Array.from(atob(parts[2]), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);

    return b64(bits) === parts[3];
  }

    document.getElementById('confirm-delete-btn').onclick = async () => {
      m.remove();
      try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', id)); }
      catch (err) { showError('刪除失敗：' + (err.message || err)); }
    };
  }

  const prefOf = d => (d.preferences && d.preferences.length === 3) ? d.preferences : null;
  const contactKey = d => (d.contact || '').trim().toLowerCase();
  const isDup = d => { const k = contactKey(d); return !!k && DUP[k] > 1; };
  const mentorOf = d => d['輔導/誰邀請您來到聚會'] || d.mentor;

  // 下拉篩選；選項從現有資料動態產生（含「其他」自填的值），multi＝欄位是陣列，任一符合即可
  const FILTERS = [
    { key: 'fellowship', label: '團契', get: d => d.fellowship },
    { key: 'pref', label: '志願組別（任一志願）', get: d => prefOf(d) || [], multi: true },
    { key: 'first', label: '第一志願', get: d => (prefOf(d) || [])[0] },
    { key: 'prefStatus', label: '志願狀態', get: d => prefOf(d) ? '已選志願' : '尚未選志願' },
    { key: 'faith', label: '信仰', get: d => d.faith },
    { key: 'source', label: '活動資訊來源', get: d => d.source },
    { key: 'sex', label: '性別', get: d => d.sex }
  ];

  // 表格欄位；有 key 的可點表頭排序
  const COLS = [
    { label: '操作' },
    { label: '填寫時間', key: 'time', get: d => d.createdAt || 0, num: true },
    { label: '姓名', key: 'name', get: d => d.name },
    { label: '團契 / 小組', key: 'fellowship', get: d => d.fellowship },
    { label: '輔導／誰邀請您來到聚會', key: 'mentor', get: mentorOf },
    { label: '性別', key: 'sex', get: d => d.sex },
    { label: '學校系級／職稱', key: 'school', get: d => d.schoolTitle },
    { label: '手機／電子信箱', key: 'contact', get: d => d.contact },
    { label: '活動資訊來源', key: 'source', get: d => d.source },
    { label: '信仰', key: 'faith', get: d => d.faith },
    { label: '活動期待' },
    { label: '希望志願 (1/2/3)', key: 'pref', get: d => (prefOf(d) || [])[0] },
    ...CATEGORIES.map(c => ({ label: c.name, key: 'c:' + c.name, get: d => d.scores ? d.scores[c.name] : undefined, num: true }))
  ];

  function filtered() {
    const list = DATA.filter(d =>
      (!FILTER || [d.name, d.fellowship, d.group, d.contact, d.schoolTitle, mentorOf(d)]
        .some(v => String(v || '').toLowerCase().includes(FILTER))) &&
      (!DUP_ONLY || isDup(d)) &&
      FILTERS.every(f => {
        const want = SEL[f.key]; if (!want) return true;
        const v = f.get(d);
        return f.multi ? v.includes(want) : (v || '') === want;
      }));
    const col = COLS.find(c => c.key === SORT.key);
    if (DUP_ONLY && SORT.key === 'time') {
      // 只看重複時，同一個聯絡方式排在一起，方便比對要刪哪筆
      list.sort((a, b) => contactKey(a).localeCompare(contactKey(b)) || (b.createdAt || 0) - (a.createdAt || 0));
    } else if (col) {
      list.sort((a, b) => {
        const x = col.get(a), y = col.get(b);
        const ex = x === undefined || x === null || x === '', ey = y === undefined || y === null || y === '';
        if (ex || ey) return ex - ey; // 空值不論升降冪都排最後
        return (col.num ? x - y : String(x).localeCompare(String(y), 'zh-Hant')) * SORT.dir;
      });
    }
    return list;
  }

  function renderDashboard() {
    main.innerHTML = `
      <div class="card fade">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px">
          <h2 style="border:0;margin:0;color:var(--navy)">答題紀錄</h2>
          <div class="row-actions">
            <button id="export-btn" class="btn sm green">匯出 Excel</button>
            <button id="logout-btn" class="ghost">登出</button>
          </div>
        </div>
        <div id="stats"></div>
        <input id="search" type="text" placeholder="搜尋姓名、團契、小組、聯絡方式…" style="margin:14px 0 10px">
        <div id="filters" class="filters"></div>
        <div class="filter-bar">
          <label><input id="dup-only" type="checkbox"> 只看聯絡方式重複的</label>
          <span><span id="count"></span>　<button id="clear-filters" class="ghost" style="padding:3px 10px">清除篩選</button></span>
        </div>
        <div id="list-container" style="min-height:160px">正在連線至資料庫...</div>
      </div>`;
    document.getElementById('logout-btn').onclick = () => {
      if (unsub) unsub(); unsub = null; DATA = []; FILTER = ''; SEL = {}; DUP_ONLY = false; SORT = { key: 'time', dir: -1 };
      renderLogin();
    };
    document.getElementById('export-btn').onclick = exportExcel;
    document.getElementById('search').oninput = e => { FILTER = e.target.value.trim().toLowerCase(); drawList(); };
    document.getElementById('dup-only').onchange = e => { DUP_ONLY = e.target.checked; drawList(); };
    document.getElementById('clear-filters').onclick = () => {
      FILTER = ''; SEL = {}; DUP_ONLY = false;
      document.getElementById('search').value = ''; document.getElementById('dup-only').checked = false;
      drawFilters(); drawList();
    };
    document.getElementById('filters').onchange = e => {
      if (e.target.dataset.filter) { SEL[e.target.dataset.filter] = e.target.value; drawList(); }
    };
    if (unsub) unsub();
    const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'submissions');
    unsub = onSnapshot(colRef, snap => {
      DATA = [];
      snap.forEach(d => DATA.push({ id: d.id, ...d.data() }));
      DUP = {};
      DATA.forEach(d => { const k = contactKey(d); if (k) DUP[k] = (DUP[k] || 0) + 1; });
      drawStats(); drawFilters(); drawList();
    }, () => {
      document.getElementById('list-container').innerHTML = `<p class="empty" style="color:#d43b3b">讀取錯誤，請檢查 Firebase 規則。</p>`;
    });
  }

  function drawStats() {
    const total = DATA.length;
    const withPref = DATA.filter(prefOf).length;
    const dups = Object.values(DUP).filter(n => n > 1).length;
    const rows = CATEGORIES.map(c => {
      const n = [0, 1, 2].map(i => DATA.filter(d => prefOf(d) && prefOf(d)[i] === c.name).length);
      return `<tr><td><b>${c.name}</b></td><td class="num">${n[0]}</td><td class="num">${n[1]}</td><td class="num">${n[2]}</td></tr>`;
    }).join('');
    document.getElementById('stats').innerHTML = `
      <div class="scores" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
        <div class="score"><div class="n">填寫人數</div><div class="v">${total}</div></div>
        <div class="score"><div class="n">已選志願</div><div class="v">${withPref}</div></div>
        <div class="score"><div class="n">尚未選志願</div><div class="v">${total - withPref}</div></div>
        <div class="score ${dups ? 'top' : ''}"><div class="n">聯絡方式重複</div><div class="v">${dups}</div></div>
      </div>
      <details class="more"><summary>各組志願人數</summary>
        <div class="tablewrap"><table style="min-width:0"><thead><tr><th>組別</th><th>第一志願</th><th>第二志願</th><th>第三志願</th></tr></thead><tbody>${rows}</tbody></table></div>
      </details>`;
  }

  // 資料即時更新時重畫選項，但保留目前選的值
  function drawFilters() {
    const box = document.getElementById('filters'); if (!box) return;
    box.innerHTML = FILTERS.map(f => {
      const count = {};
      DATA.forEach(d => { const v = f.get(d); (f.multi ? v : [v]).forEach(x => { if (x) count[x] = (count[x] || 0) + 1; }); });
      const sel = SEL[f.key] || '';
      if (sel && !count[sel]) count[sel] = 0;
      const opts = Object.keys(count).sort((a, b) => count[b] - count[a] || a.localeCompare(b, 'zh-Hant'));
      return `<div><label>${f.label}</label><select data-filter="${f.key}">
        <option value="">全部</option>
        ${opts.map(o => `<option value="${esc(o)}"${o === sel ? ' selected' : ''}>${esc(o)}（${count[o]}）</option>`).join('')}
      </select></div>`;
    }).join('');
  }

  function drawList() {
    const c = document.getElementById('list-container');
    if (!c) return;
    const list = filtered();
    document.getElementById('count').textContent = `顯示 ${list.length} / ${DATA.length} 筆（匯出會匯出目前顯示的資料）`;
    if (!list.length) { c.innerHTML = "<p class='empty'>沒有符合的資料</p>"; return; }
    const arrow = k => SORT.key === k ? (SORT.dir > 0 ? ' ▲' : ' ▼') : '';
    c.innerHTML = `
      <div class="tablewrap"><table>
        <thead><tr>${COLS.map(col => col.key
          ? `<th data-sort="${col.key}" title="點擊排序">${col.label}${arrow(col.key)}</th>`
          : `<th>${col.label}</th>`).join('')}</tr></thead>
        <tbody>${list.map(d => {
          const dup = isDup(d);
          const p = prefOf(d);
          return `<tr${dup ? ' style="background:#fff8d6"' : ''}>
            <td><button data-id="${esc(d.id)}" class="ghost delete-btn" style="color:#d43b3b;border-color:#d43b3b">刪除</button></td>
            <td style="white-space:nowrap">${esc(d.timestamp) || '-'}</td>
            <td style="white-space:nowrap"><b>${esc(d.name) || '-'}</b></td>
            <td>${esc(d.fellowship) || '-'}<small>${esc(d.group) || '-'}</small></td>
            <td>${esc(mentorOf(d)) || '-'}</td>
            <td>${esc(d.sex) || '-'}</td><td>${esc(d.schoolTitle) || '-'}</td>
            <td>${esc(d.contact) || '-'}${dup ? `<small style="color:#a42626">⚠ 聯絡方式重複（共 ${DUP[contactKey(d)]} 筆）</small>` : ''}</td>
            <td>${esc(d.source) || '-'}</td><td>${esc(d.faith) || '-'}</td>
            <td>${esc(Array.isArray(d.hopes) ? d.hopes.join('、') : d.hopes) || '-'}</td>
            <td style="white-space:nowrap">${p ? `1. ${esc(p[0])}<br>2. ${esc(p[1])}<br>3. ${esc(p[2])}` : '-'}</td>
            ${CATEGORIES.map(x => `<td class="num">${d.scores && d.scores[x.name] !== undefined ? d.scores[x.name] : '-'}</td>`).join('')}
          </tr>`; }).join('')}</tbody>
      </table></div>`;
  }
  document.addEventListener('click', e => {
    const th = e.target.closest('th[data-sort]');
    if (th) {
      const k = th.dataset.sort;
      const col = COLS.find(c => c.key === k);
      // 同欄再點一次反轉；換欄時數字（分數、時間）預設大到小，文字預設 A→Z
      SORT = SORT.key === k ? { key: k, dir: -SORT.dir } : { key: k, dir: col.num ? -1 : 1 };
      drawList(); return;
    }
    const b = e.target.closest('.delete-btn'); if (!b) return;
    e.preventDefault(); showDeleteConfirm(b.dataset.id);
  });

  // 匯出欄位與舊版相同；只匯出目前篩選後的資料。沒自訂排序時照舊由舊到新，有點表頭排序就照畫面順序
  async function exportExcel() {
    const btn = document.getElementById('export-btn');
    btn.disabled = true; btn.textContent = '準備匯出...';
    try {
      let list = filtered();
      if (SORT.key === 'time' && SORT.dir === -1 && !DUP_ONLY) list = list.slice().reverse();
      const out = list.map(d => {
        const row = {
          '填寫時間': d.timestamp || '', '姓名': d.name || '', '性別': d.sex || '',
          '團契': d.fellowship || '', '小組': d.group || '',
          '輔導/誰邀請您來到聚會': mentorOf(d) || '',
          '學校系級/職稱': d.schoolTitle || '', '手機/電子信箱': d.contact || '',
          '從哪裡得知活動資訊': d.source || '', '信仰': d.faith || '',
          '希望透過本活動': Array.isArray(d.hopes) ? d.hopes.join('、') : (d.hopes || ''),
          '第一志願': (d.preferences || [])[0] || '', '第二志願': (d.preferences || [])[1] || '', '第三志願': (d.preferences || [])[2] || ''
        };
        CATEGORIES.forEach(c => row[c.name] = d.scores && d.scores[c.name] !== undefined ? d.scores[c.name] : '');
        return row;
      });
      if (!out.length) { showError('目前篩選沒有資料可以匯出'); return; }
      try {
        if (!window.XLSX) await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
          s.onload = res; s.onerror = () => rej(new Error('Excel 元件載入失敗')); document.head.appendChild(s);
        });
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(out), '評量結果');
        XLSX.writeFile(wb, '多元智能評量結果.xlsx');
      } catch (xerr) {
        const headers = out.length ? Object.keys(out[0]) : ['填寫時間', '姓名'];
        const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
        const csv = '\ufeff' + [headers.map(cell).join(','), ...out.map(r => headers.map(h => cell(r[h])).join(','))].join('\r\n');
        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        const a = document.createElement('a'); a.href = url; a.download = '多元智能評量結果.csv';
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        showError('Excel 元件無法載入，已改為匯出 Excel 可開啟的 CSV 檔。');
      }
    } catch (err) { showError('匯出失敗：' + (err.message || err)); }
    finally { btn.disabled = false; btn.textContent = '匯出 Excel'; }
  }

  renderLogin();
</script>
</head>
<body>
  <div class="topbar"><div class="wrap">
    <b>多元智能評量　後台</b>
    <a class="ghost" href="../">前往問卷</a>
  </div></div>
  <div class="wrap">
    <main>
      <div id="error-banner" class="error hidden" role="alert"></div>
      <div id="main-content"></div>
    </main>
  </div>
</body>
</html>
